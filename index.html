<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gideon's Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-1: #ffe6f0;
    --bg-2: #e6f0ff;
    --bg-3: #fff4d6;
    --card-bg: #ffffffcc;
    --pink: #ffb3c6;
    --lavender: #cdb4f5;
    --blue: #a8d8ff;
    --mint: #b7f0d1;
    --peach: #ffd8b8;
    --yellow: #fff1a6;
    --text-dark: #4a4458;
    --text-muted: #8b8499;
    --shadow: 0 10px 30px rgba(150, 120, 180, 0.15);
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    font-family: 'Poppins', sans-serif;
    color: var(--text-dark);
    background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    text-align: center;
  }

  .balloon {
    position: fixed;
    font-size: 2.5rem;
    opacity: 0.55;
    animation: float 9s ease-in-out infinite;
    pointer-events: none;
    user-select: none;
    z-index: 0;
  }
  .balloon.b1 { top: 10%; left: 8%; animation-delay: 0s; }
  .balloon.b2 { top: 65%; left: 5%; animation-delay: 2s; font-size: 2rem; }
  .balloon.b3 { top: 15%; right: 8%; animation-delay: 1s; }
  .balloon.b4 { top: 70%; right: 10%; animation-delay: 3s; font-size: 2.2rem; }
  .balloon.b5 { top: 40%; left: 3%; animation-delay: 4s; font-size: 1.6rem; }
  .balloon.b6 { top: 45%; right: 4%; animation-delay: 1.5s; font-size: 1.6rem; }

  @keyframes float {
    0%, 100% { transform: translateY(0px) rotate(-3deg); }
    50% { transform: translateY(-24px) rotate(3deg); }
  }

  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 780px;
  }

  h1 {
    font-weight: 800;
    font-size: clamp(2rem, 6vw, 3.2rem);
    margin: 0 0 6px;
    background: linear-gradient(90deg, #ff9ec4, #b39ddb, #90caf9);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    font-weight: 400;
    color: var(--text-muted);
    margin: 0 0 36px;
    font-size: clamp(0.95rem, 2vw, 1.1rem);
  }

  .today {
    font-weight: 500;
    font-size: 0.9rem;
    color: var(--text-muted);
    background: var(--card-bg);
    display: inline-block;
    padding: 8px 18px;
    border-radius: 999px;
    margin-bottom: 32px;
    box-shadow: var(--shadow);
  }

  .panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }

  @media (max-width: 640px) {
    .panels { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--card-bg);
    border-radius: 24px;
    padding: 28px 20px 24px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.6);
  }

  .panel h2 {
    margin: 0 0 20px;
    font-weight: 600;
    font-size: 1.05rem;
    letter-spacing: 0.02em;
  }

  .panel.until h2 { color: #d16ba5; }
  .panel.since h2 { color: #5b9bd5; }

  .stat-row {
    display: flex;
    gap: 14px;
    justify-content: center;
  }

  .stat {
    flex: 1;
    border-radius: 18px;
    padding: 16px 8px;
  }

  .panel.until .stat.days { background: linear-gradient(160deg, var(--pink), #ffd6e6); }
  .panel.until .stat.weeks { background: linear-gradient(160deg, var(--lavender), #e3d7fb); }
  .panel.since .stat.days { background: linear-gradient(160deg, var(--blue), #d3ecff); }
  .panel.since .stat.weeks { background: linear-gradient(160deg, var(--mint), #dcf9e8); }

  .stat .value {
    font-weight: 700;
    font-size: clamp(1.6rem, 5vw, 2.3rem);
    line-height: 1;
    color: #574f68;
  }

  .stat .label {
    margin-top: 6px;
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .live-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #7ee8a3;
    margin-right: 6px;
    box-shadow: 0 0 0 rgba(126, 232, 163, 0.6);
    animation: pulse 1.6s infinite;
    vertical-align: middle;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(126, 232, 163, 0.6); }
    70% { box-shadow: 0 0 0 8px rgba(126, 232, 163, 0); }
    100% { box-shadow: 0 0 0 0 rgba(126, 232, 163, 0); }
  }

  .live-label {
    font-size: 0.8rem;
    color: var(--text-muted);
    font-weight: 500;
    margin-top: 6px;
  }

  footer {
    margin-top: 12px;
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  footer span {
    color: #d16ba5;
  }
</style>
</head>
<body>

<span class="balloon b1">🎈</span>
<span class="balloon b2">🎂</span>
<span class="balloon b3">🎉</span>
<span class="balloon b4">🎈</span>
<span class="balloon b5">🎁</span>
<span class="balloon b6">✨</span>

<main>
  <h1>Gideon's Birthday</h1>
  <p class="subtitle">A live countdown to (and count-up from) the 28th of April</p>

  <div class="today" id="todayLine">Loading today's date…</div>

  <div class="panels">
    <section class="panel until">
      <h2>⏳ Until 28th April</h2>
      <div class="stat-row">
        <div class="stat days">
          <div class="value" id="untilDays">–</div>
          <div class="label">Days</div>
        </div>
        <div class="stat weeks">
          <div class="value" id="untilWeeks">–</div>
          <div class="label">Weeks</div>
        </div>
      </div>
    </section>

    <section class="panel since">
      <h2>🎉 Since 28th April</h2>
      <div class="stat-row">
        <div class="stat days">
          <div class="value" id="sinceDays">–</div>
          <div class="label">Days</div>
        </div>
        <div class="stat weeks">
          <div class="value" id="sinceWeeks">–</div>
          <div class="label">Weeks</div>
        </div>
      </div>
    </section>
  </div>

  <div class="live-label"><span class="live-dot"></span>Updating live</div>

  <footer>Counting the days to <span>28th April</span>, every year 🌷</footer>
</main>

<script>
  const untilDaysEl = document.getElementById('untilDays');
  const untilWeeksEl = document.getElementById('untilWeeks');
  const sinceDaysEl = document.getElementById('sinceDays');
  const sinceWeeksEl = document.getElementById('sinceWeeks');
  const todayLineEl = document.getElementById('todayLine');

  const MS_PER_DAY = 24 * 60 * 60 * 1000;

  function startOfDay(d) {
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }

  function aprilTwentyEighth(year) {
    return new Date(year, 3, 28); // month is 0-indexed, so 3 = April
  }

  function update() {
    const now = new Date();
    const today = startOfDay(now);
    const year = today.getFullYear();

    let nextBirthday = aprilTwentyEighth(year);
    if (nextBirthday < today) {
      nextBirthday = aprilTwentyEighth(year + 1);
    }

    let lastBirthday = aprilTwentyEighth(year);
    if (lastBirthday > today) {
      lastBirthday = aprilTwentyEighth(year - 1);
    }

    const daysUntil = Math.round((nextBirthday - today) / MS_PER_DAY);
    const daysSince = Math.round((today - lastBirthday) / MS_PER_DAY);

    untilDaysEl.textContent = daysUntil.toLocaleString();
    untilWeeksEl.textContent = (daysUntil / 7).toFixed(1);
    sinceDaysEl.textContent = daysSince.toLocaleString();
    sinceWeeksEl.textContent = (daysSince / 7).toFixed(1);

    todayLineEl.textContent = 'Today is ' + now.toLocaleDateString(undefined, {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });
  }

  update();
  setInterval(update, 1000);
</script>

</body>
</html>
